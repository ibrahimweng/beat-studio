<!doctype html>
<html><head><meta charset="utf-8" /><title>pack check</title></head><body><pre id="out">working…</pre>
<script type="module">
  /* Render every sound in every published pack twice: once with the real
     @web-kits/audio engine, and once by reading it into this app's own model
     and playing it the way everything else here is played. */
  import { renderToBuffer } from '/tools/.wk/dist/index.js';
  import { toSpec } from '/src/audio/pack.ts';
  import { renderVoice } from '/src/audio/voice-spec.ts';

  const RATE = 44100, WINDOWS = 8, BANDS = 20;
  const PACKS = ['core','crisp','drums','mechanical','minimal','organic','playful','retro','soft','synths'];

  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const ur = re[i + k], ui = im[i + k];
          const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
          const vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
          re[i + k] = ur + vr; im[i + k] = ui + vi;
          re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
          const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
        }
      }
    }
  }
  function extent(d) { let l = 0; for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > 0.0015) l = i; return Math.max(RATE * 0.02, l); }
  function fingerprint(data) {
    const size = 2048, span = extent(data), step = Math.max(1, Math.floor(span / WINDOWS));
    const edges = []; for (let b = 0; b <= BANDS; b++) edges.push(40 * Math.pow(20000 / 40, b / BANDS));
    const timbre = [], envelope = [];
    for (let w = 0; w < WINDOWS; w++) {
      const start = w * step, re = new Float64Array(size), im = new Float64Array(size);
      let sum = 0;
      for (let i = 0; i < size; i++) {
        const v = data[start + i] ?? 0; sum += v * v;
        re[i] = v * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / size));
      }
      envelope.push(Math.sqrt(sum / size));
      fft(re, im);
      const bands = new Array(BANDS).fill(0);
      for (let k = 1; k < size / 2; k++) {
        const hzv = (k * RATE) / size, mag = Math.hypot(re[k], im[k]);
        for (let b = 0; b < BANDS; b++) if (hzv >= edges[b] && hzv < edges[b + 1]) { bands[b] += mag; break; }
      }
      const norm = Math.hypot(...bands) || 1;
      for (const b of bands) timbre.push(b / norm);
    }
    const en = Math.hypot(...envelope) || 1;
    const out = timbre.concat(envelope.map((v) => (v / en) * 2));
    const t = Math.hypot(...out) || 1;
    return out.map((v) => v / t);
  }
  const cosine = (a, b) => a.reduce((d, v, i) => d + v * b[i], 0);
  const rms = (d) => { let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i]; return Math.sqrt(s / d.length); };

  const rows = [];
  const skipped = [];
  const out = document.getElementById('out');

  for (const packName of PACKS) {
    const pack = await (await fetch(`/tools/.wk/packs/${packName}.json`)).json();
    out.textContent = `${packName}…`;
    for (const [name, def] of Object.entries(pack.sounds)) {
      const { spec, why } = toSpec(def);
      if (!spec) { skipped.push(`${packName}/${name}: ${why}`); continue; }
      const seconds = Math.min(6, Math.max(0.4, spec.duration + 0.4));

      let theirs, mine, error = null;
      try {
        theirs = (await renderToBuffer(def, { duration: seconds, sampleRate: RATE, numberOfChannels: 1 }))
          .getChannelData(0);
        const ctx = new OfflineAudioContext(1, Math.ceil(RATE * seconds), RATE);
        renderVoice(ctx, ctx.destination, spec, 0, 12345);
        mine = (await ctx.startRendering()).getChannelData(0);
      } catch (e) { error = String(e.message ?? e); }

      if (error) { rows.push({ pack: packName, name, error }); continue; }
      const theirLevel = rms(theirs);
      rows.push({
        pack: packName,
        name,
        match: +cosine(fingerprint(theirs), fingerprint(mine)).toFixed(4),
        levelRatio: +(rms(mine) / (theirLevel || 1e-9)).toFixed(3),
        silent: rms(mine) < 1e-7,
        theirsSilent: theirLevel < 1e-7,
      });
    }
  }

  const ok = rows.filter((r) => !r.error && !r.theirsSilent);
  const matches = ok.map((r) => r.match).sort((a, b) => a - b);
  const levels = ok.map((r) => r.levelRatio).sort((a, b) => a - b);
  document.getElementById('out').textContent = JSON.stringify({
    sounds: rows.length,
    skipped,
    errors: rows.filter((r) => r.error).slice(0, 5),
    silent: ok.filter((r) => r.silent).map((r) => `${r.pack}/${r.name}`),
    match: { worst: matches[0], median: matches[Math.floor(matches.length / 2)], best: matches[matches.length - 1] },
    level: { median: levels[Math.floor(levels.length / 2)] },
    under90: ok.filter((r) => r.match < 0.9).map((r) => `${r.pack}/${r.name} ${r.match}`),
  }, null, 1);
  document.title = 'done';
</script></body></html>
