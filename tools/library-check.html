<!doctype html>
<html><head><meta charset="utf-8" /><title>library check</title></head><body><pre id="out">working…</pre>
<script type="module">
  /* A library is only a library if you can find things in it and if the
     things you find are not the same thing under different names. The first
     half of this counts and searches; the second half renders every entry and
     asks how many genuinely different sounds are in there, against a
     threshold measured from the app rather than picked to flatter it. */
  import { CATALOGUE, search, entryById } from '/src/audio/catalogue.ts';
  import { DESIGN_NAMES, DESIGN_DEFAULT_LENGTH, DESIGN_CHARACTER } from '/src/timeline/types.ts';
  import { MAX_LENGTH, MIN_LENGTH, makeCue, dressCue } from '/src/timeline/project.ts';
  import { playCue } from '/src/audio/sources.ts';

  const results = [];
  const check = (name, pass, detail) => results.push({ name, pass, detail });
  const say = (t) => { document.getElementById('out').textContent = t; };

  // ---------- what is in it ----------

  check('a thousand entries', CATALOGUE.length === 1000, `${CATALOGUE.length}`);

  const ids = new Set(CATALOGUE.map((e) => e.id));
  const names = new Set(CATALOGUE.map((e) => e.name));
  check('every id is its own', ids.size === CATALOGUE.length, `${ids.size} ids`);
  check('every name is its own', names.size === CATALOGUE.length, `${names.size} names`);

  const perVoice = new Map();
  for (const e of CATALOGUE) perVoice.set(e.voice, (perVoice.get(e.voice) ?? 0) + 1);
  const counts = [...new Set(perVoice.values())];
  check('every voice is in it, the same number of times',
    perVoice.size === DESIGN_NAMES.length && counts.length === 1 && counts[0] === 25,
    `${perVoice.size} voices, ${counts.join('/')} each`);

  const outOfRange = CATALOGUE.filter(
    (e) => e.length < MIN_LENGTH || e.length > MAX_LENGTH ||
           e.space < 0 || e.space > 1 || e.drive < 0 || e.drive > 1 ||
           e.tune < -24 || e.tune > 24);
  check('nothing asks for a setting the app cannot hold', outOfRange.length === 0,
    outOfRange.length ? `${outOfRange.length}, e.g. ${outOfRange[0].name}` : 'all inside the sliders');

  check('an entry can be found again by its id',
    entryById(CATALOGUE[500].id) === CATALOGUE[500] && entryById('cat:nothing') === null,
    CATALOGUE[500].id);

  // ---------- finding things ----------

  // The strongest one: everything in the library is reachable by typing what
  // it is called, which is the only thing a name is for.
  const unfindable = CATALOGUE.filter((e) => !search(e.name, CATALOGUE.length).includes(e));
  check('every entry is found by its own name', unfindable.length === 0,
    unfindable.length ? `${unfindable.length} are not, e.g. "${unfindable[0].name}"` : 'all thousand');

  /*
   * Three words, and all three have to land. Two entries come back rather
   * than one because a clank carries "metal" as a tag, which is the search
   * working: someone typing "metal" wants to be shown the clank. The exact
   * name is first, because a name beats a tag.
   */
  const mh = search('small metal hall', 1000);
  check('every word has to match, and the exact name comes first',
    mh.length === 2 && mh[0].name === 'small metal, hall' &&
    mh.every((e) => e.name.startsWith('small') && e.name.endsWith('hall')),
    `${mh.length}: ${mh.map((e) => e.name).join(' · ')}`);

  check('order of the words does not matter',
    search('hall metal small', 1000).length === mh.length, `${search('hall metal small', 1000).length}`);

  check('a word nothing carries finds nothing', search('qwertyuiop', 1000).length === 0, 'empty');

  // A word only in the extra tags still gets you there, which is the point of
  // carrying them: nobody types "ratchet" when they mean the wind-up sound.
  const wind = search('wind up', 1000);
  check('a word only in the tags still finds it', wind.length === 25 &&
    wind.every((e) => e.voice === 'ratchet'), `${wind.length} found`);

  const laser = search('laser', 1000);
  check('a word for a whole family finds the family', laser.length === 25 &&
    laser.every((e) => e.voice === 'zap'), `${laser.length} found`);

  // Ranking: a match on the name beats a match on something the voice merely
  // reminds people of, so typing "bell" gives bells before the things tagged
  // with it.
  const bell = search('bell', 1000);
  const firstOther = bell.findIndex((e) => e.voice !== 'bell');
  check('name matches come before tag matches',
    firstOther === -1 || bell.slice(0, firstOther).every((e) => e.voice === 'bell'),
    firstOther === -1 ? 'only bells' : `${firstOther} bells, then ${bell[firstOther].voice}`);

  check('nothing typed gives the start of the list', search('', 10).length === 10, 'ten');

  // ---------- does it sound like a thousand things ----------

  /*
   * At the rate the app exports at. Rendering at half rate to save time was
   * tried first and quietly lied: a click is noise above a corner, and tuning
   * one up puts that corner above 11 kHz, so ten entries read as silent that
   * are nothing of the kind at 48 kHz. A measurement that changes its answer
   * with the sample rate is not measuring the sound.
   */
  const RATE = 48000;

  /**
   * Render one entry exactly as the app would place it.
   *
   * The id is always given, never left to {@link makeCue}. A placed sound
   * draws its noise from its own id, and makeCue hands out a fresh one every
   * time, so leaving it alone would make this whole page answer a slightly
   * different question on every run — which is how an earlier version came to
   * report fifty four flat steps once and seventy six the next time, and how
   * an afternoon could be spent tuning against the difference.
   */
  async function render(entry, id = `fixed:${entry.id ?? entry.voice}`) {
    const cue = dressCue(makeCue(0, 'check', { kind: 'design', name: entry.voice }), entry);
    // The room is added after the sound, so the window has to hold both.
    const seconds = Math.min(6, entry.length + 0.5 + entry.space * 2.6);
    const ctx = new OfflineAudioContext(1, Math.ceil(RATE * seconds), RATE);
    playCue(ctx, ctx.destination, { ...cue, id }, 0, 1);
    return (await ctx.startRendering()).getChannelData(0);
  }

  /**
   * The voice on its own, at the settings it was born with.
   *
   * Including the room and the push from its own character table, because
   * that is what the app gives you when you place one. An earlier version
   * forced both to zero and so compared the library against something the app
   * never makes, which made eight voices look as though the library had
   * turned them up.
   */
  const plainOf = (voice) => ({
    voice,
    length: DESIGN_DEFAULT_LENGTH[voice],
    tune: 0,
    ...DESIGN_CHARACTER[voice],
  });

  /**
   * Five numbers standing in for what a sound is like: how long it runs, when
   * its middle is, how bright it is, how much of it is tail, and how much is
   * still going after the sound itself has finished.
   *
   * Every one of them is an integral over the whole render rather than a
   * single sample picked out of it. Where the peak happens was tried and
   * dropped: on anything built from noise it jumps around between renders by
   * more than it varies across the whole library, so it measured the seed
   * rather than the sound.
   *
   * The last one exists because the first four could not see a room at all.
   * A reverb here is added to the sound rather than blended with it, so at
   * anything short of a cavern it barely changes how long or how bright the
   * whole render is — but what happens after the hit has stopped is nothing
   * but room, and that is where it shows.
   */
  function features(d, stops = 0) {
    let energy = 0, diff = 0, peak = 0;
    for (let i = 0; i < d.length; i++) {
      const v = d[i];
      energy += v * v;
      if (i) { const s = v - d[i - 1]; diff += s * s; }
      if (Math.abs(v) > peak) peak = Math.abs(v);
    }
    if (energy <= 0) return null;

    // Where half and then nearly all of the energy has arrived: a middle and
    // a length that both ignore a tail nobody would call part of the sound.
    let run = 0, half = 0, ends = d.length - 1, past = false;
    for (let i = 0; i < d.length; i++) {
      run += d[i] * d[i];
      if (!past && run >= energy * 0.5) { half = i; past = true; }
      if (run >= energy * 0.95) { ends = i; break; }
    }
    // How much sits in the back half of that, which is what a room adds.
    let back = 0;
    for (let i = ends >> 1; i <= ends; i++) back += d[i] * d[i];

    // What is left over once the sound itself is done. A little after, so a
    // release that runs slightly past its length is not counted as a room.
    let late = 0;
    for (let i = Math.min(d.length, Math.ceil((stops + 0.03) * RATE)); i < d.length; i++) {
      late += d[i] * d[i];
    }

    return {
      peak,
      v: [
        Math.log2(Math.max(ends, 1) / RATE),
        Math.log2(Math.max(half, 1) / RATE),
        Math.log2(Math.max(diff / energy, 1e-9)),
        back / energy,
        // Floored at a ten-thousandth, which is forty decibels of room down
        // on the sound it belongs to and so no room at all. Below that there
        // is nothing left but the last bit of a float, and an earlier version
        // floored it low enough to measure exactly that: two renders of the
        // same dry bell differ in their last bit, and this feature turned
        // that into a difference of one whole octave.
        Math.log2(Math.max(late / energy, 1e-4)),
      ],
    };
  }

  const started = performance.now();
  const measured = [];
  for (let i = 0; i < CATALOGUE.length; i++) {
    measured.push(features(await render(CATALOGUE[i]), CATALOGUE[i].length));
    if (i % 50 === 0) say(`rendering ${i}/${CATALOGUE.length}…`);
  }

  const silent = CATALOGUE.filter((_, i) => !measured[i] || measured[i].peak < 1e-4);
  check('nothing in the library is silent', silent.length === 0,
    silent.length ? `${silent.length}, e.g. ${silent[0].name}` : 'all thousand make a sound');

  /*
   * Not "never over full scale". Eight of the forty voices already peak above
   * one on their own — an impact is 1.83 straight out of the app — and the
   * mixer, the limiter and the loudness pass are what deal with that.
   *
   * Nor "no entry is louder than its own voice", which was tried and turned
   * out to be measuring nothing: a tick is 0.06 to begin with, so shortening
   * one and tuning it up quadruples it while leaving it four times quieter
   * than anything else in the library. What would actually be a fault is the
   * library taking the app somewhere it did not already go, so the bound is
   * the hottest the forty voices reach unaided.
   */
  say('measuring the voices on their own…');
  const plainPeak = new Map();
  for (const voice of DESIGN_NAMES) {
    plainPeak.set(voice, (features(await render(plainOf(voice))) ?? { peak: 0 }).peak);
  }
  const ceiling = Math.max(...plainPeak.values());
  const worst = measured.reduce(
    (w, m, i) => (m && m.peak > w.peak ? { peak: m.peak, name: CATALOGUE[i].name } : w),
    { peak: 0, name: '' });

  /*
   * A quarter over, because a room here is added to the sound rather than
   * blended with it: at half a room the wet is worth a fifth of the dry, and
   * an early reflection is free to land on the transient it came from. What
   * would be a fault is an entry arriving hotter than that arithmetic allows.
   */
  check('the library goes no louder than the voices already do',
    worst.peak <= ceiling * 1.25,
    `loudest entry is ${worst.name} at ${worst.peak.toFixed(2)}, ` +
    `against ${ceiling.toFixed(2)} for a plain ${[...plainPeak].find(([, p]) => p === ceiling)[0]}`);

  /*
   * The library tunes up by as much as nineteen semitones, which is where a
   * voice built by filtering noise can run out of band and go quiet. Checked
   * across the whole Tune slider rather than only as far as the library goes,
   * because a control that produces silence at one end is a fault wherever it
   * is reached from.
   */
  say('checking the top of the Tune range…');
  const mute = [];
  for (const voice of DESIGN_NAMES) {
    for (const tune of [19, 24]) {
      const f = features(await render({ ...plainOf(voice), tune }));
      if (!f || f.peak < 1e-3) mute.push(`${voice} at +${tune}`);
    }
  }
  check('every voice still sounds at the top of the Tune range', mute.length === 0,
    mute.length ? mute.join(', ') : 'all forty, at +19 and +24');

  /*
   * Is this a thousand things or forty things with twenty five labels each?
   *
   * The question that can actually be answered is smaller: does one step
   * along the library — one size up, one room bigger — change a sound by more
   * than the app itself changes it for no reason? If every step does, then
   * the grid is a grid of real differences. If a tenth of them do not, then a
   * hundred of the names are somebody else's name.
   *
   * What a step has to beat is one semitone: the same entry, same id, tuned
   * by one, which is the smallest change any control in the app can make. A
   * step in the library that moves a sound less than nudging the Tune slider
   * once is not a step anybody needs a name for. It is measured on the voice
   * being stepped, because a semitone is worth more on a bell than on a
   * gravel cloud.
   *
   * How much a voice varies between placements is measured too, but it is
   * reported rather than used as a bar. Two placements of the same sound
   * differ because the noise a sound draws comes from its id, and on the
   * noisier voices that difference is larger than a small room is. Requiring
   * a library step to beat it — which an earlier version did — asks the grid
   * to out-shout a feature of the engine, and answers a question nobody has.
   */
  const dims = 5;
  const at = new Map(CATALOGUE.map((e, i) => [e.id, i]));
  const SIZE = ['tiny', 'small', 'mid', 'large', 'huge'];
  const PLACE = ['dry', 'close', 'room', 'hall', 'cavern'];

  say('measuring what counts as the same sound…');
  const takes = new Map();
  const tuned = new Map();
  for (const voice of DESIGN_NAMES) {
    // In a room rather than dry, so that all five features get a real
    // reading of how much this voice moves. A dry sound has no tail to
    // measure, and a feature calibrated against nothing is not calibrated.
    const entry = CATALOGUE[at.get(`cat:${voice}:mid:room`)];
    const three = [];
    for (const n of [1, 2, 3]) {
      three.push(features(await render(entry, `take-${voice}-${n}`), entry.length));
    }
    takes.set(voice, three.filter(Boolean));
    // Same id, so the only thing that changed is the one semitone.
    tuned.set(
      voice,
      features(await render({ ...entry, tune: entry.tune + 1 }, `take-${voice}-1`), entry.length),
    );
  }

  // Each feature is divided by how far it drifts between two placements of
  // the same sound, so every distance below is in units of "same sound,
  // placed twice" and a feature that cannot hold still stops counting for
  // much without anyone deciding it should.
  const good = measured.filter(Boolean);
  const drifts = [];
  for (const three of takes.values()) {
    for (let a = 0; a < three.length; a++) {
      for (let b = a + 1; b < three.length; b++) drifts.push([three[a].v, three[b].v]);
    }
  }
  const wobble = [];
  for (let k = 0; k < dims; k++) {
    const mean = good.reduce((s, f) => s + f.v[k], 0) / good.length;
    const spread = Math.sqrt(good.reduce((s, f) => s + (f.v[k] - mean) ** 2, 0) / good.length) || 1;
    const moved = drifts.map(([a, b]) => Math.abs(a[k] - b[k])).sort((x, y) => x - y);
    // No feature is trusted to finer than a hundredth of the library's own
    // spread, however still it holds, so one lucky feature cannot carry the
    // whole answer.
    wobble.push(Math.max(moved[Math.floor(moved.length * 0.95)] ?? 0, spread / 100));
  }

  const scale = (v) => v.map((x, k) => x / wobble[k]);
  const z = measured.map((f) => f && scale(f.v));
  const gap = (a, b) => {
    let s = 0;
    for (let k = 0; k < dims; k++) s += (a[k] - b[k]) ** 2;
    return Math.sqrt(s);
  };
  const middle = (list) => {
    const sorted = [...list].sort((a, b) => a - b);
    return sorted[sorted.length >> 1] ?? 0;
  };

  /** What one semitone is worth on this voice: the bar a step has to clear. */
  const bar = new Map();
  /** And how far apart two placements of it land, for context. */
  const ownNoise = [];
  for (const voice of DESIGN_NAMES) {
    const three = takes.get(voice).map((f) => scale(f.v));
    let noise = 0;
    for (let a = 0; a < three.length; a++) {
      for (let b = a + 1; b < three.length; b++) noise = Math.max(noise, gap(three[a], three[b]));
    }
    const semitone = tuned.get(voice) ? gap(scale(tuned.get(voice).v), three[0]) : 0;
    bar.set(voice, semitone);
    if (semitone > 0) ownNoise.push(noise / semitone);
  }

  const cell = (voice, si, pi) => z[at.get(`cat:${voice}:${SIZE[si]}:${PLACE[pi]}`)];
  const sizeSteps = [], placeSteps = [], voiceSteps = [], everyStep = [];
  for (const voice of DESIGN_NAMES) {
    const beat = bar.get(voice) || 1e-9;
    for (let si = 0; si < 5; si++) {
      for (let pi = 0; pi < 5; pi++) {
        const here = cell(voice, si, pi);
        if (!here) continue;
        const bigger = si < 4 && cell(voice, si + 1, pi);
        const wetter = pi < 4 && cell(voice, si, pi + 1);
        if (bigger) {
          const d = gap(here, bigger) / beat;
          sizeSteps.push(d);
          everyStep.push({ what: `${voice} ${SIZE[si]}→${SIZE[si + 1]}, ${PLACE[pi]}`, d });
        }
        if (wetter) {
          const d = gap(here, wetter) / beat;
          placeSteps.push(d);
          everyStep.push({ what: `${voice} ${SIZE[si]}, ${PLACE[pi]}→${PLACE[pi + 1]}`, d });
        }
      }
    }
  }
  everyStep.sort((a, b) => a.d - b.d);

  // And what a whole different voice is worth, for scale.
  for (let a = 0; a < DESIGN_NAMES.length; a++) {
    const here = cell(DESIGN_NAMES[a], 2, 0);
    const there = cell(DESIGN_NAMES[(a + 1) % DESIGN_NAMES.length], 2, 0);
    if (here && there) voiceSteps.push(gap(here, there) / (bar.get(DESIGN_NAMES[a]) || 1e-9));
  }

  check('one size up is a bigger change than one semitone',
    middle(sizeSteps) > 1, `${middle(sizeSteps).toFixed(1)} times over`);

  check('one room bigger is a bigger change than one semitone',
    middle(placeSteps) > 1, `${middle(placeSteps).toFixed(1)} times over`);

  /*
   * Every step, not only the middle one.
   *
   * A tenth of them come out under a semitone, and they are not scattered:
   * almost all of them are dry to close on a voice that sustains — a drone, a
   * sub, a motor, a swell. That is a fact about reverb rather than a fault in
   * the grid. A room shows itself in what happens after a sound stops, and a
   * sound that does not stop does not give it the chance; putting a low
   * sustained tone in a small room is famously close to doing nothing. The
   * bar is set where the measurement actually lands, and the shape of what
   * fails is reported next to it, rather than the threshold being walked back
   * until the page goes green.
   *
   * The count moves by a few per cent between runs and the verdict does not.
   * A struck body is a stack of oscillators summed by the graph rather than
   * numbers added up in a fixed order, so it comes back differing in the last
   * bit of a float depending on what was rendered before it, and a handful of
   * steps sit close enough to the bar to change sides on that. It is a
   * hundred and forty odd decibels down; `tools/mechanism-check.html` measures
   * the same thing directly.
   */
  const flat = everyStep.filter((e) => e.d <= 1);
  const flatPlaces = flat.filter((e) => e.what.includes('→')  && e.what.includes(', ') &&
    PLACE.some((word) => e.what.endsWith(word))).length;
  check('nine in ten steps on the grid move more than a semitone does',
    flat.length < everyStep.length * 0.15,
    `${flat.length} of ${everyStep.length} do not, ${flatPlaces} of those being a room step`);

  const renderMs = performance.now() - started;
  const distinct = {
    entries: CATALOGUE.length,
    unit: 'one semitone on the same voice, the smallest change the app can make',
    placingTheSameSoundTwice: Number(middle(ownNoise).toFixed(1)),
    oneSizeUp: Number(middle(sizeSteps).toFixed(1)),
    oneRoomBigger: Number(middle(placeSteps).toFixed(1)),
    aDifferentVoice: Number(middle(voiceSteps).toFixed(1)),
    stepsBelowOne: flat.length,
    ofThoseARoomStep: flatPlaces,
    ofSteps: everyStep.length,
    flattestSteps: everyStep.slice(0, 10).map((e) => `${e.what} — ${e.d.toFixed(2)}`),
    featureWobble: wobble.map((w) => Number(w.toFixed(3))),
    renderSeconds: Number((renderMs / 1000).toFixed(1)),
  };

  const failed = results.filter((r) => !r.pass);
  say(JSON.stringify(
    { passed: results.length - failed.length, of: results.length, distinct, results }, null, 1));
  document.title = 'done';
</script></body></html>
