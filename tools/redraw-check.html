<!doctype html>
<html><head><meta charset="utf-8" /><title>redraw check</title></head><body><pre id="out">working…</pre>
<script type="module">
  /* Two placements of one library entry. How different are they, really?
     A recorded library gives you five takes of a door slam and they differ.
     This asks what this app gives you when you place the same name twice. */
  import { CATALOGUE } from '/src/audio/catalogue.ts';
  import { makeCue, dressCue } from '/src/timeline/project.ts';
  import { playCue } from '/src/audio/sources.ts';
  import { print, alike, ordinary } from '/src/audio/listen.ts';
  const say = (t) => { document.getElementById('out').textContent = t; };
  const RATE = 48000;
  const render = async (entry, id, vary) => {
    const cue = { ...dressCue(makeCue(0, 'l', { kind: 'design', name: entry.voice }), entry), id, vary };
    const secs = Math.min(7, entry.length + 0.4 + entry.space * 2.6);
    const ctx = new OfflineAudioContext(1, Math.ceil(RATE * secs), RATE);
    playCue(ctx, ctx.destination, cue, 0, 1);
    const d = (await ctx.startRendering()).getChannelData(0);
    /*
     * A second measure, because the first one cannot see the tail.
     *
     * The fingerprint is twenty bands from 40 Hz to 10 kHz, so a third of a
     * semitone is a tenth of a band and moving a sub or a beep by that much
     * leaves the print all but unchanged — 100% before, 99.8% after, while the
     * two are no longer the same file at all. Peak level and where the weight
     * sits say what actually moved.
     */
    let peak = 0, num = 0, den = 0;
    for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
    // Centre of the print, which is a stand-in for where the brightness sits.
    const pr = print(d, RATE, 0, d.length);
    for (let i = 0; i < pr.length; i++) { num += pr[i] * (i % 20); den += pr[i]; }
    return { print: pr, data: d, peak, centre: den > 0 ? num / den : 0 };
  };
  // One entry per voice, at a middling size in a room.
  const picks = [];
  const seen = new Set();
  for (const e of CATALOGUE) {
    if (seen.has(e.voice)) continue;
    if (e.size !== 'mid' && e.size !== '' && e.name.split(',')[0].trim() !== e.voice) continue;
    seen.add(e.voice); picks.push(e);
  }
  /*
   * Every voice twice, at two settings.
   *
   * With the control at nothing, which is what the app did before any of this
   * existed and is the only fair thing to compare against; and at whatever it
   * defaults to now. Measured in one run so the two sides cannot drift apart.
   */
  const DEFAULT_VARY = 0.3;
  const rows = [];
  const prints = [];
  for (const e of picks) {
    const off = [await render(e, `redraw:a:${e.id}`, 0), await render(e, `redraw:b:${e.id}`, 0)];
    const on = [
      await render(e, `redraw:a:${e.id}`, DEFAULT_VARY),
      await render(e, `redraw:b:${e.id}`, DEFAULT_VARY),
      // A third, so the number can say when it does not mean anything. A
      // glitch scatters its bursts from the seed, so two placements of it are
      // two different arrangements and there is nothing for the fingerprint to
      // line up: its reading swings between 0% and 64% run to run with no code
      // changing. Three takes make that visible instead of puzzling.
      await render(e, `redraw:c:${e.id}`, DEFAULT_VARY),
    ];
    prints.push(off[0].print, off[1].print, on[0].print, on[1].print, on[2].print);
    let same = 0;
    const n = Math.min(on[0].data.length, on[1].data.length);
    for (let i = 0; i < n; i++) if (on[0].data[i] === on[1].data[i]) same++;
    const shift = (x, y) => (Math.max(x.peak, y.peak) > 1e-6
      ? Math.abs(20 * Math.log10(Math.max(1e-9, x.peak) / Math.max(1e-9, y.peak)))
      : 0);
    rows.push({
      voice: e.voice, name: e.name,
      bitIdentical: same === n,
      offA: off[0].print, offB: off[1].print,
      a: on[0].print, b: on[1].print, c: on[2].print,
      dbOff: shift(off[0], off[1]), dbOn: shift(on[0], on[1]),
      brightOff: Math.abs(off[0].centre - off[1].centre),
      brightOn: Math.abs(on[0].centre - on[1].centre),
    });
    say(`${rows.length} of ${picks.length}…`);
    await new Promise(r => setTimeout(r));
  }
  const usual = ordinary(prints);
  for (const r of rows) {
    const ab = alike(r.a, r.b, usual), ac = alike(r.a, r.c, usual);
    r.match = (ab + ac) / 2;
    // How far the two readings of the same thing disagree. Big here means the
    // voice is a scatter and the number below it is not measuring anything.
    r.unsure = Math.abs(ab - ac);
    r.wasMatch = alike(r.offA, r.offB, usual);
  }
  const SCATTER = 0.2;

  /*
   * The half that stops this being a win on paper.
   *
   * Two takes of a sound have to still be that sound. So beside "how alike are
   * two placements" sits "how alike is a placement to a different voice" — the
   * first has to stay well clear of the second, or variation has bought a
   * difference by throwing the identity away.
   */
  const nearestFor = (key, selfKey) => {
    const out = [];
    for (let i = 0; i < rows.length; i++) {
      let best = -1, who = '';
      for (let j = 0; j < rows.length; j++) {
        if (i === j) continue;
        const m = alike(rows[i][key], rows[j][key], usual);
        if (m > best) { best = m; who = rows[j].voice; }
      }
      out.push({ voice: rows[i].voice, self: rows[i][selfKey], other: best, who });
    }
    return out;
  };
  const nearest = nearestFor('a', 'match');
  const wasNearest = nearestFor('offA', 'wasMatch');
  const held = nearest.filter((n) => n.self > n.other);
  const wasHeld = wasNearest.filter((n) => n.self > n.other);
  const midOther = [...nearest].sort((a, b) => a.other - b.other)[Math.floor(nearest.length / 2)].other;

  rows.sort((x, y) => x.match - y.match);
  const pct = (x) => `${(x * 100).toFixed(1)}%`;
  const mid = (key) => [...rows].sort((a, b) => a[key] - b[key])[Math.floor(rows.length / 2)][key];
  const bitsOff = rows.filter((r) => r.wasMatch >= 0.9999).length;

  // Voices that were already nearer something else than themselves before any
  // of this: their trouble is the noise seed, not the variation on top of it.
  const alreadyLost = new Set(wasNearest.filter((n) => n.self <= n.other).map((n) => n.voice));
  const newlyLost = nearest.filter((n) => n.self <= n.other && !alreadyLost.has(n.voice));
  const stillLost = nearest.filter((n) => n.self <= n.other && alreadyLost.has(n.voice));

  say([
    `Placing the same entry twice, ${rows.length} voices, at the control off and on.`,
    ``,
    `TWO TAKES OF ONE SOUND        off        on`,
    `  how alike they are   ${pct(mid('wasMatch')).padStart(9)} ${pct(mid('match')).padStart(9)}   (median)`,
    `  bit for bit the same ${String(bitsOff).padStart(9)} ${String(rows.filter((r) => r.bitIdentical).length).padStart(9)}   of ${rows.length}`,
    ``,
    `  level between takes  ${mid('dbOff').toFixed(2).padStart(7)}dB ${mid('dbOn').toFixed(2).padStart(7)}dB   (median)`,
    `  brightness moved     ${mid('brightOff').toFixed(3).padStart(9)} ${mid('brightOn').toFixed(3).padStart(9)}   (bands, median)`,
    ``,
    `Every voice, most varied first — off, then on:`,
    ...rows.map((r) => `  ${r.voice.padEnd(11)}${pct(r.wasMatch).padStart(8)} → ${pct(r.match).padStart(7)}   ${r.dbOn.toFixed(2).padStart(5)}dB`),
    ``,
    `IS IT STILL THE SAME SOUND`,
    `  nearer its own voice than any other: ${wasHeld.length} off, ${held.length} on, of ${nearest.length}`,
    `  nearest different voice: median ${pct(midOther)}`,
    ...(rows.filter((r) => r.unsure >= SCATTER).length
      ? [``, `Voices whose own number means nothing — two readings of the same`,
         `thing disagree by more than ${pct(SCATTER)}, because the voice scatters what`,
         `it is made of and there is nothing to line up:`,
         ...rows.filter((r) => r.unsure >= SCATTER)
           .map((r) => `  ${r.voice.padEnd(11)} two readings ${pct(r.unsure)} apart`)]
      : []),
    ...(newlyLost.filter((n) => (rows.find((r) => r.voice === n.voice)?.unsure ?? 0) < SCATTER).length
      ? [``, `Lost by turning it on — these are the ones to answer for:`,
         ...newlyLost.filter((n) => (rows.find((r) => r.voice === n.voice)?.unsure ?? 0) < SCATTER)
           .map((n) => `  ${n.voice} is ${pct(n.other)} like ${n.who}, but only ${pct(n.self)} like itself`)]
      : [``, `Nothing lost its identity that had it: every voice that read as`,
         `itself with the control off still does with it on.`]),
    ...(stillLost.length
      ? [``, `Already like this with the control off, from the noise seed alone:`,
         `  ${stillLost.map((n) => n.voice).join(', ')}`]
      : []),
  ].join('\n'));
  document.title = 'done';
</script></body></html>
