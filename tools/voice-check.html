<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>voice check</title></head>
  <body>
    <pre id="out">working…</pre>
    <script type="module">
      import { playDesign } from '/src/audio/design-voices.ts';
      import { DESIGN_NAMES, DESIGN_DEFAULT_LENGTH } from '/src/timeline/types.ts';

      const RATE = 44100;
      const SECONDS = 3;
      const WINDOWS = 8;
      const BANDS = 20;

      /** Iterative radix-2 FFT, in place, on real input. */
      function fft(re, im) {
        const n = re.length;
        for (let i = 1, j = 0; i < n; i++) {
          let bit = n >> 1;
          for (; j & bit; bit >>= 1) j ^= bit;
          j ^= bit;
          if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
        }
        for (let len = 2; len <= n; len <<= 1) {
          const ang = (-2 * Math.PI) / len;
          const wr = Math.cos(ang), wi = Math.sin(ang);
          for (let i = 0; i < n; i += len) {
            let cr = 1, ci = 0;
            for (let k = 0; k < len / 2; k++) {
              const ur = re[i + k], ui = im[i + k];
              const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
              const vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
              re[i + k] = ur + vr; im[i + k] = ui + vi;
              re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
              const nr = cr * wr - ci * wi;
              ci = cr * wi + ci * wr; cr = nr;
            }
          }
        }
      }

      /** Where the sound actually is, so silence after it is not compared. */
      function extent(data) {
        let last = 0;
        for (let i = 0; i < data.length; i++) {
          if (Math.abs(data[i]) > 0.0015) last = i;
        }
        return Math.max(RATE * 0.02, last);
      }

      /**
       * A fingerprint of what a sound is made of and how it moves.
       *
       * Measured across the sound's own length rather than a fixed three
       * seconds. Comparing a twenty millisecond click against a two second
       * drone over the same fixed window made every short sound look alike,
       * because seven eighths of both were silence.
       *
       * Each moment is normalised on its own, so the comparison is about the
       * shape of the sound rather than how loud it happens to be, and the
       * loudness over time is added separately as its own feature.
       */
      function fingerprint(data) {
        const size = 2048;
        const span = extent(data);
        const step = Math.max(1, Math.floor(span / WINDOWS));
        const edges = [];
        for (let b = 0; b <= BANDS; b++) {
          edges.push(40 * Math.pow(20000 / 40, b / BANDS));
        }

        const timbre = [];
        const envelope = [];

        for (let w = 0; w < WINDOWS; w++) {
          const start = w * step;
          const re = new Float64Array(size), im = new Float64Array(size);
          let sum = 0;
          for (let i = 0; i < size; i++) {
            const v = data[start + i] ?? 0;
            sum += v * v;
            // Hann window, so the edges of each slice do not smear.
            re[i] = v * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / size));
          }
          envelope.push(Math.sqrt(sum / size));

          fft(re, im);
          const bands = new Array(BANDS).fill(0);
          for (let k = 1; k < size / 2; k++) {
            const hz = (k * RATE) / size;
            const mag = Math.hypot(re[k], im[k]);
            for (let b = 0; b < BANDS; b++) {
              if (hz >= edges[b] && hz < edges[b + 1]) { bands[b] += mag; break; }
            }
          }
          const norm = Math.hypot(...bands) || 1;
          for (const b of bands) timbre.push(b / norm);
        }

        const envNorm = Math.hypot(...envelope) || 1;
        const out = timbre
          .concat(envelope.map((v) => (v / envNorm) * 2))
          .concat(texture(data, span));
        const total = Math.hypot(...out) || 1;
        return out.map((v) => v / total);
      }

      /**
       * Whether a sound is one event or many.
       *
       * The bands and the envelope above miss this entirely. Slice a single
       * tick and a run of twenty of them into the same number of windows
       * across their own lengths and both give the same timbre in every
       * window and much the same shape over the whole, so they measure as
       * nearly the same sound while being obviously different to anyone
       * listening. That gap did not matter when every voice was one event.
       * It matters now that whole mechanisms exist to repeat.
       *
       * Two numbers: how much the level jumps about from moment to moment,
       * and how often it jumps upward. A drone scores near zero on both, a
       * single tick scores high on the first and low on the second, and a
       * ratchet scores high on both.
       */
      function texture(data, span) {
        const hop = 256;
        const env = [];
        for (let i = 0; i + hop < span; i += hop) {
          let peak = 0;
          for (let j = 0; j < hop; j++) peak = Math.max(peak, Math.abs(data[i + j]));
          env.push(peak);
        }
        if (env.length < 3) return [0, 0];

        const mean = env.reduce((a, b) => a + b, 0) / env.length || 1e-9;
        let jumps = 0, rises = 0;
        for (let i = 1; i < env.length; i++) {
          jumps += Math.abs(env[i] - env[i - 1]);
          if (env[i] > env[i - 1] * 1.6 && env[i] > mean * 0.4) rises++;
        }
        const seconds = span / RATE;
        // Weighted to matter as much as a handful of bands, so it can separate
        // sounds the spectrum cannot without drowning out the spectrum.
        return [
          Math.min(1.5, jumps / ((env.length - 1) * mean)) * 1.5,
          Math.min(1, rises / seconds / 30) * 1.5,
        ];
      }

      function cosine(a, b) {
        let dot = 0;
        for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
        return dot;
      }

      /*
       * Rendered from fixed seeds, and from more than one of them.
       *
       * Most of these voices are built on noise, so left to itself every
       * render draws a different sound and every comparison comes out a
       * little different: measured twice without this, an unchanged pair of
       * voices moved by five hundredths, which is more than the differences
       * being looked for here. Seeding makes a run repeatable. Using three
       * seeds and averaging stops the answer being an accident of which
       * particular noise one of them happened to draw.
       */
      const SEEDS = [1, 2, 3];
      const prints = {};
      const levels = {};
      for (const name of DESIGN_NAMES) {
        prints[name] = [];
        for (const seed of SEEDS) {
          const ctx = new OfflineAudioContext(1, RATE * SECONDS, RATE);
          playDesign(ctx, ctx.destination, name, 0, {
            length: DESIGN_DEFAULT_LENGTH[name], tune: 0, gain: 1, seed,
          });
          const buffer = await ctx.startRendering();
          const data = buffer.getChannelData(0);
          prints[name].push(fingerprint(data));
          if (seed === SEEDS[0]) {
            let peak = 0, sum = 0;
            for (let i = 0; i < data.length; i++) {
              peak = Math.max(peak, Math.abs(data[i]));
              sum += data[i] * data[i];
            }
            levels[name] = { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / data.length).toFixed(4) };
          }
        }
      }

      /** How alike two voices are, averaged over the seeds. */
      const alike = (a, b) => {
        let sum = 0;
        for (let s = 0; s < SEEDS.length; s++) sum += cosine(prints[a][s], prints[b][s]);
        return sum / SEEDS.length;
      };

      const pairs = [];
      const names = DESIGN_NAMES;
      for (let i = 0; i < names.length; i++) {
        for (let j = i + 1; j < names.length; j++) {
          pairs.push({ a: names[i], b: names[j], similarity: alike(names[i], names[j]) });
        }
      }
      pairs.sort((x, y) => y.similarity - x.similarity);

      document.getElementById('out').textContent = JSON.stringify({
        voices: names.length,
        closest: pairs.slice(0, 12).map((p) => ({ pair: `${p.a} / ${p.b}`, similarity: +p.similarity.toFixed(3) })),
        median: +pairs[Math.floor(pairs.length / 2)].similarity.toFixed(3),
        // A voice nobody can hear, or one that takes the roof off, is no use
        // however distinct it measures.
        silent: Object.entries(levels).filter(([, l]) => l.peak < 0.02).map(([n]) => n),
        loudest: Object.entries(levels).sort((a, b) => b[1].peak - a[1].peak).slice(0, 5)
          .map(([n, l]) => `${n} ${l.peak}`),
        quietest: Object.entries(levels).sort((a, b) => a[1].peak - b[1].peak).slice(0, 5)
          .map(([n, l]) => `${n} ${l.peak}`),
      }, null, 2);
      document.title = 'done';
    </script>
  </body>
</html>
