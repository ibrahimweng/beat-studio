<!doctype html>
<html><head><meta charset="utf-8" /><title>wk</title></head><body><pre id="out">working…</pre>
<script type="module">
  /* Render the exported patch with the real @web-kits/audio engine and
     compare each sound against Beat Studio's own rendering of the same voice. */
  import { definePatch } from '/tools/.wk/dist/index.js';
  import { playDesign } from '/src/audio/design-voices.ts';
  import { drum } from '/src/audio/voices.ts';
  import { DESIGN_NAMES, DESIGN_DEFAULT_LENGTH } from '/src/timeline/types.ts';
  import { KIT_SOUNDS } from '/src/constants.ts';

  const RATE = 44100, SECONDS = 3, WINDOWS = 8, BANDS = 20;

  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const ur = re[i + k], ui = im[i + k];
          const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
          const vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
          re[i + k] = ur + vr; im[i + k] = ui + vi;
          re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
          const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
        }
      }
    }
  }
  function extent(d) { let l = 0; for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > 0.0015) l = i; return Math.max(RATE * 0.02, l); }
  function fingerprint(data) {
    const size = 2048, span = extent(data), step = Math.max(1, Math.floor(span / WINDOWS));
    const edges = []; for (let b = 0; b <= BANDS; b++) edges.push(40 * Math.pow(20000 / 40, b / BANDS));
    const timbre = [], envelope = [];
    for (let w = 0; w < WINDOWS; w++) {
      const start = w * step, re = new Float64Array(size), im = new Float64Array(size);
      let sum = 0;
      for (let i = 0; i < size; i++) {
        const v = data[start + i] ?? 0; sum += v * v;
        re[i] = v * (0.5 - 0.5 * Math.cos((2 * Math.PI * i) / size));
      }
      envelope.push(Math.sqrt(sum / size));
      fft(re, im);
      const bands = new Array(BANDS).fill(0);
      for (let k = 1; k < size / 2; k++) {
        const hzv = (k * RATE) / size, mag = Math.hypot(re[k], im[k]);
        for (let b = 0; b < BANDS; b++) if (hzv >= edges[b] && hzv < edges[b + 1]) { bands[b] += mag; break; }
      }
      const norm = Math.hypot(...bands) || 1;
      for (const b of bands) timbre.push(b / norm);
    }
    const en = Math.hypot(...envelope) || 1;
    const out = timbre.concat(envelope.map((v) => (v / en) * 2));
    const t = Math.hypot(...out) || 1;
    return out.map((v) => v / t);
  }
  const cosine = (a, b) => a.reduce((d, v, i) => d + v * b[i], 0);
  const rms = (d) => { let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i]; return Math.sqrt(s / d.length); };

  const patch = await (await fetch('/tools/.wk/patch.json')).json();

  // Their engine plays into a live context, so it is pointed at an offline
  // one by rendering the same definition through the exported render path.
  const { renderToBuffer } = await import('/tools/.wk/dist/index.js');

  const ours = {};
  for (const name of DESIGN_NAMES) {
    const ctx = new OfflineAudioContext(1, RATE * SECONDS, RATE);
    playDesign(ctx, ctx.destination, name, 0, { length: DESIGN_DEFAULT_LENGTH[name], tune: 0, gain: 1 });
    ours[name] = (await ctx.startRendering()).getChannelData(0);
  }
  for (const { pad, label } of KIT_SOUNDS) {
    const ctx = new OfflineAudioContext(1, RATE * SECONDS, RATE);
    drum(ctx, ctx.destination, pad, 0, 1);
    ours[label.toLowerCase().replace(/[^a-z0-9]+/g, '-')] = (await ctx.startRendering()).getChannelData(0);
  }

  const rows = [];
  for (const [name, def] of Object.entries(patch.sounds)) {
    let theirs = null, error = null;
    try {
      const buf = await renderToBuffer(def, { duration: SECONDS, sampleRate: RATE, numberOfChannels: 1 });
      theirs = buf.getChannelData(0);
    } catch (e) { error = String(e.message ?? e); }
    if (!theirs) { rows.push({ name, error }); continue; }
    const mine = ours[name];
    rows.push({
      name,
      match: +cosine(fingerprint(mine), fingerprint(theirs)).toFixed(4),
      levelRatio: +(rms(theirs) / (rms(mine) || 1e-9)).toFixed(3),
      silent: rms(theirs) < 1e-6,
    });
  }
  rows.sort((a, b) => (a.match ?? -1) - (b.match ?? -1));
  document.getElementById('out').textContent = JSON.stringify({ engine: '0.1.0', rows }, null, 1);
  document.title = 'done';
</script></body></html>
