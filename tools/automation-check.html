<!doctype html>
<html><head><meta charset="utf-8" /><title>automation check</title></head><body><pre id="out">working…</pre>
<script type="module">
  /* A curve drawn over a layer has to reach the file, and has to move
     everything on that layer together. */
  import { renderProject, renderStems } from '/src/audio/render.ts';
  import { emptyProject, emptyLanes, makeCue, layerLevelAt, laneValueAt, shape, bendFor } from '/src/timeline/project.ts';
  import { DEFAULT_CHAIN } from '/src/audio/chain.ts';

  const RATE = 48000;
  const results = [];
  const check = (name, pass, detail) => results.push({ name, pass, detail });

  /*
   * One set of sounds, reused for every render.
   *
   * A sound draws its noise from its own id and every new sound gets a new
   * one, so two projects built the same way are not the same sound and their
   * levels differ by a percent or two. Built once and only the layer swapped,
   * the comparisons below are exact rather than nearly.
   */
  const base = (() => {
    const p = { ...emptyProject(), duration: 4 };
    const id = p.layers[0].id;
    /* The probe has to be one constant sound, so `vary` is pinned off: this
       is measuring what a layer's automation does to a level, and a probe
       that came out a fraction different every time would be measuring the
       probe. Placed sounds vary by default now, which is the point of it —
       see `src/audio/vary.ts` — and exactly what a yardstick must not do. */
    p.cues = [0, 1, 2, 3].map((t) => ({
      ...makeCue(t, id, { kind: 'design', name: 'static' }),
      length: 1, gain: 1, space: 0, drive: 0, vary: 0,
    }));
    return p;
  })();

  /** A steady bed of sound on one layer, so a change is easy to read. */
  function project(lanes, gain = 1) {
    const id = base.layers[0].id;
    const auto = { ...emptyLanes(), ...lanes };
    return {
      ...base,
      layers: base.layers.map((l) => (l.id === id ? { ...l, auto, gain } : l)),
    };
  }

  async function render(p, settings = DEFAULT_CHAIN) {
    const r = await renderProject(p, { settings, master: { limit: false, target: null } });
    return r.parts[0].buffer;
  }

  /** The same, with the room at the end of the chain out of the way. */
  const DRY = { ...DEFAULT_CHAIN, reverb: 0 };

  /** How loud each second is, which is what a drawn level should move. */
  function seconds(buffer, channel = 0) {
    const d = buffer.getChannelData(channel);
    return [0, 1, 2, 3].map((second) => {
      let sum = 0, n = 0;
      for (let i = Math.round((second + 0.2) * RATE); i < Math.round((second + 0.8) * RATE); i++) {
        sum += d[i] * d[i]; n++;
      }
      return Math.sqrt(sum / n);
    });
  }

  const levels = async (p) => seconds(await render(p));

  // ---------- level ----------

  // 1. Nothing drawn behaves as it always did.
  const flat = await levels(project({}));
  check('with nothing drawn the level holds steady',
    Math.max(...flat) / Math.min(...flat) < 1.15, flat.map((v) => v.toFixed(4)).join(', '));

  // 2. A fade from full to nothing is heard as one.
  const faded = await levels(project({ level: [{ t: 0, value: 1 }, { t: 4, value: 0 }] }));
  check('a fade is heard as a fade',
    faded[0] > faded[1] && faded[1] > faded[2] && faded[2] > faded[3],
    faded.map((v) => v.toFixed(4)).join(', '));
  check('the fade reaches the values that were drawn',
    Math.abs(faded[1] / faded[0] - 0.75 / 0.98) < 0.15,
    `second one is ${(faded[1] / faded[0]).toFixed(2)} of second zero`);

  // 3. It moves everything on the layer together, including sounds that
  //    overlap, which is why it cannot be folded into each sound.
  // Held down across the whole of the third second rather than only touching
  // the bottom at one instant, so the measurement sits inside the dip rather
  // than across the ramps into and out of it.
  const dipped = await levels(project({ level: [
    { t: 0, value: 1 }, { t: 1.9, value: 1 }, { t: 2.1, value: 0.1 },
    { t: 2.9, value: 0.1 }, { t: 3.1, value: 1 },
  ] }));
  check('a dip in the middle only dips the middle',
    dipped[2] < dipped[1] * 0.5 && dipped[3] > dipped[2] * 1.5,
    dipped.map((v) => v.toFixed(4)).join(', '));

  // 4. Drawing takes over from the fixed level rather than multiplying with it.
  const halfFixed = await levels(project({}, 0.5));
  const drawnFull = await levels(project({ level: [{ t: 0, value: 1 }, { t: 4, value: 1 }] }, 0.5));
  check('a drawn level replaces the fixed one rather than stacking with it',
    Math.abs(drawnFull[0] / halfFixed[0] - 2) < 0.25,
    `fixed at half ${halfFixed[0].toFixed(4)}, drawn at full ${drawnFull[0].toFixed(4)}`);

  // ---------- pan ----------

  // 5. Nothing drawn leaves the two sides as they were.
  const centred = await render(project({}));
  const evenL = seconds(centred, 0), evenR = seconds(centred, 1);
  check('with nothing drawn neither side is favoured',
    Math.abs(evenL[0] - evenR[0]) / evenL[0] < 0.05,
    `left ${evenL[0].toFixed(4)}, right ${evenR[0].toFixed(4)}`);

  // 6. The one that matters: drawing a position and leaving it in the middle
  //    has to change nothing at all, or adding a lane would quietly move a
  //    mix that was already right.
  const held = await render(project({ pan: [{ t: 0, value: 0 }, { t: 4, value: 0 }] }));
  const heldL = seconds(held, 0), heldR = seconds(held, 1);
  check('a position drawn down the middle is the same mix as none at all',
    heldL.every((v, i) => Math.abs(v / evenL[i] - 1) < 0.01) &&
    heldR.every((v, i) => Math.abs(v / evenR[i] - 1) < 0.01),
    `left ${heldL[0].toFixed(4)} against ${evenL[0].toFixed(4)}`);

  // A layer whose level is set rather than drawn keeps that level when a
  // position is drawn on it, and keeps it exactly once: the fixed level is
  // folded into each sound, and the bus must not apply it a second time.
  const quietFixed = await render(project({}, 0.5));
  const quietPanned = await render(project({ pan: [{ t: 0, value: 0 }, { t: 4, value: 0 }] }, 0.5));
  check('a fixed level is applied once, not twice, when a position is drawn',
    Math.abs(seconds(quietPanned)[0] / seconds(quietFixed)[0] - 1) < 0.01,
    `${seconds(quietPanned)[0].toFixed(4)} against ${seconds(quietFixed)[0].toFixed(4)}`);

  // 7. Held hard over, one side has all of it and the other has none.
  const hard = await render(project({ pan: [{ t: 0, value: -1 }, { t: 4, value: -1 }] }));
  const hardL = seconds(hard, 0), hardR = seconds(hard, 1);
  check('held hard left, the right side is silent',
    hardR[0] < hardL[0] * 0.02, `left ${hardL[0].toFixed(4)}, right ${hardR[0].toFixed(4)}`);
  check('and the left side keeps everything it had',
    Math.abs(hardL[0] / evenL[0] - 1) < 0.02,
    `hard left ${hardL[0].toFixed(4)} against centred ${evenL[0].toFixed(4)}`);

  // 8. A sweep across the picture crosses over, and goes through the middle
  //    at full rather than dipping: what a position is worth to each side is
  //    a curve, so it has to be written as one.
  const swept = await render(project({ pan: [{ t: 0, value: -1 }, { t: 4, value: 1 }] }));
  const sweptL = seconds(swept, 0), sweptR = seconds(swept, 1);
  check('a sweep crosses from one side to the other',
    sweptL[0] > sweptR[0] * 2 && sweptR[3] > sweptL[3] * 2,
    `starts ${sweptL[0].toFixed(4)}/${sweptR[0].toFixed(4)}, ends ${sweptL[3].toFixed(4)}/${sweptR[3].toFixed(4)}`);
  check('it crosses gradually rather than jumping',
    sweptR.every((v, i) => i === 0 || v > sweptR[i - 1]) && sweptL[3] < sweptL[2] && sweptL[2] < sweptL[1],
    `right ${sweptR.map((v) => v.toFixed(4)).join(', ')}`);
  check('the side it has not left yet keeps everything it had',
    Math.abs(sweptL[1] / evenL[1] - 1) < 0.02 && Math.abs(sweptR[2] / evenR[2] - 1) < 0.02,
    `left through second one ${sweptL[1].toFixed(4)} against ${evenL[1].toFixed(4)}`);

  // 9. Moving a layer across can quieten it, since half the speakers fall
  //    silent, but it must never make it louder: this is a tool for handing
  //    over files that do not clip.
  const power = (l, r, i) => Math.sqrt(l[i] * l[i] + r[i] * r[i]);
  const carried = [0, 1, 2, 3].map((i) => power(sweptL, sweptR, i) / power(evenL, evenR, i));
  check('moving it across never makes it louder than it was',
    carried.every((ratio) => ratio <= 1.02), carried.map((v) => v.toFixed(3)).join(', '));
  // The reason the position is written once a frame rather than ramped
  // straight from one drawn point to the next. Ramped, a sweep in two moves
  // passes through the middle with both sides at a half, six decibels down.
  check('and passing through the middle of a sweep leaves no hole in it',
    carried[1] > 0.9 && carried[2] > 0.9,
    `${carried[1].toFixed(3)} and ${carried[2].toFixed(3)} of centred`);

  // ---------- space ----------

  /** How much is still sounding in a gap, which is what a room leaves behind. */
  function tail(buffer, from, to) {
    const d = buffer.getChannelData(0);
    let sum = 0, n = 0;
    for (let i = Math.round(from * RATE); i < Math.round(to * RATE); i++) { sum += d[i] * d[i]; n++; }
    return Math.sqrt(sum / n);
  }

  /** One short sound, then silence, so a tail has somewhere to be heard. */
  const hit = {
    ...makeCue(0.2, base.layers[0].id, { kind: 'design', name: 'impact' }),
    // Pinned, for the reason above: a yardstick must not vary.
    vary: 0,
    length: 0.3, gain: 1, space: 0, drive: 0,
  };

  function gapped(lanes, cueSpace = 0) {
    const id = base.layers[0].id;
    return {
      ...base,
      layers: base.layers.map((l) => (l.id === id ? { ...l, auto: { ...emptyLanes(), ...lanes } } : l)),
      cues: [{ ...hit, space: cueSpace }],
    };
  }

  const flatSpace = (value) => ({ space: [{ t: 0, value }, { t: 4, value }] });

  const dry = await render(gapped({}));
  const wet = await render(gapped(flatSpace(1)));
  check('a room drawn over a layer leaves a tail where there was none',
    tail(wet, 1.5, 2.5) > tail(dry, 1.5, 2.5) * 4,
    `dry ${tail(dry, 1.5, 2.5).toFixed(6)}, in a room ${tail(wet, 1.5, 2.5).toFixed(6)}`);
  check('and the sound itself still arrives at the level it always did',
    Math.abs(tail(wet, 0.2, 0.5) / tail(dry, 0.2, 0.5) - 1) < 0.05,
    `dry ${tail(dry, 0.2, 0.5).toFixed(4)}, in a room ${tail(wet, 0.2, 0.5).toFixed(4)}`);

  const none = await render(gapped(flatSpace(0)));
  check('a room drawn at nothing is no room at all',
    Math.abs(tail(none, 1.5, 2.5) / tail(dry, 1.5, 2.5) - 1) < 0.05,
    `nothing drawn ${tail(dry, 1.5, 2.5).toFixed(6)}, drawn at zero ${tail(none, 1.5, 2.5).toFixed(6)}`);

  const half = await render(gapped(flatSpace(0.5)));
  check('halfway up leaves less tail than the top of it',
    tail(half, 1.5, 2.5) < tail(wet, 1.5, 2.5) * 0.75 && tail(half, 1.5, 2.5) > tail(dry, 1.5, 2.5) * 1.5,
    `dry ${tail(dry, 1.5, 2.5).toFixed(6)}, half ${tail(half, 1.5, 2.5).toFixed(6)}, full ${tail(wet, 1.5, 2.5).toFixed(6)}`);

  // The layer room and the room on a single sound are two different pieces of
  // machinery, so the only thing that keeps the two controls meaning the same
  // thing is that they were measured against each other.
  const onSound = await render(gapped({}, 1));
  check('a layer taken all the way up is about as wet as a sound taken all the way up',
    Math.abs(tail(wet, 1.5, 2.5) / tail(onSound, 1.5, 2.5) - 1) < 0.2,
    `whole layer ${tail(wet, 1.5, 2.5).toFixed(6)}, one sound ${tail(onSound, 1.5, 2.5).toFixed(6)}`);

  // Drawn on a layer nobody is playing through, it must not conjure anything.
  const silent = await render({ ...gapped(flatSpace(1)), cues: [] });
  check('a room on a layer with nothing on it is silent',
    tail(silent, 0, 4) < 1e-6, tail(silent, 0, 4).toExponential(2));

  // ---------- curves and holds ----------

  /*
   * The shape between two points, on its own, before any of it reaches a
   * sound. Everything below rests on these three being true.
   */
  check('no shape at all is a straight line',
    shape(0.25, undefined) === 0.25 && shape(0.5, 0) === 0.5 && shape(0.75, undefined) === 0.75, '');
  check('a hold does not move until it arrives',
    shape(0.01, 'hold') === 0 && shape(0.99, 'hold') === 0 && shape(1, 'hold') === 1, '');
  // Bending one way and bending the other by the same amount have to be the
  // same curve turned over, or dragging a segment up and back down again
  // would not arrive where it started.
  const mirrored = [0.1, 0.25, 0.5, 0.75, 0.9].map((u) =>
    Math.abs(shape(u, 0.6) + shape(1 - u, -0.6) - 1));
  check('bending up and bending down by the same amount are the same curve turned over',
    Math.max(...mirrored) < 1e-12, `largest difference ${Math.max(...mirrored).toExponential(2)}`);
  check('a bend never doubles back on itself',
    [-1, -0.5, 0.5, 1].every((b) => {
      let last = -1;
      for (let u = 0; u <= 1.0001; u += 0.01) {
        const v = shape(u, b);
        if (v < last) return false;
        last = v;
      }
      return true;
    }), '');
  check('and the drag works out the bend that puts the middle where the hand is',
    Math.abs(shape(0.5, bendFor(0.2)) - 0.2) < 1e-9 &&
    Math.abs(shape(0.5, bendFor(0.8)) - 0.8) < 1e-9 && bendFor(0.5) === 0,
    `${shape(0.5, bendFor(0.2)).toFixed(4)} and ${shape(0.5, bendFor(0.8)).toFixed(4)}`);

  // Reading a lane has to agree with all of that.
  const bentLane = [{ t: 0, value: 0 }, { t: 2, value: 1, curve: 0.6 }];
  const heldLane = [{ t: 0, value: 0 }, { t: 2, value: 1, curve: 'hold' }];
  check('a lane reads its shapes the same way',
    Math.abs(laneValueAt(bentLane, 1, 0) - shape(0.5, 0.6)) < 1e-12 &&
    laneValueAt(heldLane, 1.99, 0) === 0 && laneValueAt(heldLane, 2, 0) === 1,
    `bent at halfway ${laneValueAt(bentLane, 1, 0).toFixed(4)}`);

  // And then the same shapes have to reach the file.
  // Held flat across the whole of the first second, so that second is the
  // same for every shape and can be used to check that they all start from
  // the same place.
  const ramp = (curve) => ({ level: [
    { t: 0, value: 1 }, { t: 1, value: 1 },
    ...(curve === undefined ? [{ t: 3.5, value: 0 }] : [{ t: 3.5, value: 0, curve }]),
  ] });

  const straightBuffer = await render(project(ramp(undefined)));
  const straightRamp = seconds(straightBuffer);
  const spelledOut = await levels(project(ramp(0)));
  check('writing a straight line down as a straight line changes nothing',
    straightRamp.every((v, i) => Math.abs(v - spelledOut[i]) < 1e-9),
    straightRamp.map((v) => v.toFixed(4)).join(', '));

  const hangsBuffer = await render(project(ramp(0.6)));
  const rushesBuffer = await render(project(ramp(-0.6)));
  const hangs = seconds(hangsBuffer);
  const rushes = seconds(rushesBuffer);
  check('a segment bent to hang back is louder for longer than a straight one',
    hangs[1] > straightRamp[1] && hangs[2] > straightRamp[2],
    `straight ${straightRamp.map((v) => v.toFixed(4)).join(', ')} against ${hangs.map((v) => v.toFixed(4)).join(', ')}`);
  check('and one bent the other way gets out of the way sooner',
    rushes[1] < straightRamp[1] && rushes[2] < straightRamp[2],
    rushes.map((v) => v.toFixed(4)).join(', '));
  /*
   * Read on either side of the shape rather than across its end, since a
   * window straddling the last point is measuring the shape and not the place
   * it finishes at. And read with the room at the end of the chain out of the
   * way: it rings on past the last point by design, most of all for the shape
   * that was loudest going into it, and that would be read as a level that
   * had not reached zero.
   */
  const after = async (curve) => tail(await render(project(ramp(curve)), DRY), 3.6, 3.9);
  const ends = [await after(undefined), await after(0.6), await after(-0.6)];
  check('every shape still starts and finishes exactly where the points are',
    Math.abs(hangs[0] / straightRamp[0] - 1) < 0.005 &&
    Math.abs(rushes[0] / straightRamp[0] - 1) < 0.005 &&
    ends.every((v) => v < straightRamp[0] * 0.001),
    `before it starts ${hangs[0].toFixed(4)}, ${rushes[0].toFixed(4)}, ${straightRamp[0].toFixed(4)}; ` +
    `after it ends ${ends.map((v) => v.toExponential(1)).join(', ')}`);

  // A hold is the one shape a bend cannot make: nothing happens, and then
  // everything does.
  const stepped = await levels(project({ level: [
    { t: 0, value: 1 }, { t: 2.5, value: 0.15, curve: 'hold' },
  ] }));
  check('a hold does not move at all, and then steps',
    Math.abs(stepped[1] / stepped[0] - 1) < 0.03 && stepped[3] < stepped[0] * 0.25,
    stepped.map((v) => v.toFixed(4)).join(', '));

  // A position is written out in steps for its own reasons, so its shapes
  // have to come through that as well.
  const heldPan = await render(project({ pan: [
    { t: 0, value: -1 }, { t: 2.5, value: 1, curve: 'hold' },
  ] }));
  const heldPanL = seconds(heldPan, 0), heldPanR = seconds(heldPan, 1);
  check('a held position stays on one side and then crosses over',
    heldPanR[1] < heldPanL[1] * 0.05 && heldPanL[3] < heldPanR[3] * 0.05,
    `second one ${heldPanL[1].toFixed(4)}/${heldPanR[1].toFixed(4)}, ` +
    `second three ${heldPanL[3].toFixed(4)}/${heldPanR[3].toFixed(4)}`);

  // ---------- drive ----------

  /*
   * A push is not a level, so it cannot be measured as one. What it does is
   * put harmonics above what was there, so the test plays one steady tone and
   * reads how much of the sound is at frequencies the tone never had.
   */
  /*
   * A long low tone, read across a short stretch of it.
   *
   * Steady on purpose. A push gives a quiet sound far more gain than a loud
   * one, so read across a decay it would show mostly as an envelope that
   * changed shape, which says nothing about what the push did to the sound
   * itself. Across a stretch where the level barely moves, what is left over
   * is the bending and only the bending.
   */
  const steady = {
    ...makeCue(0.2, base.layers[0].id, { kind: 'design', name: 'sub' }),
    // Pinned, for the reason above: a yardstick must not vary.
    vary: 0,
    length: 3.5, gain: 1, space: 0, drive: 0,
  };

  function tone(lanes, cueDrive = 0) {
    const id = base.layers[0].id;
    return {
      ...base,
      layers: base.layers.map((l) => (l.id === id ? { ...l, auto: { ...emptyLanes(), ...lanes } } : l)),
      cues: [{ ...steady, drive: cueDrive }],
    };
  }

  /*
   * A push is not a level, so it cannot be measured as one.
   *
   * The plain render and the pushed one come from the same sounds, so the
   * closest a push could come to doing nothing is turning them up. Fitting
   * the one scale that brings the plain render nearest the pushed one and
   * taking it away leaves exactly what the push added, and nothing else. That
   * residue is what saturation is, and reading it makes no assumption about
   * where the sound sat in the first place.
   */
  const WINDOW = [Math.round(0.5 * RATE), Math.round(1 * RATE)];

  function added(plainBuffer, pushedBuffer) {
    const a = plainBuffer.getChannelData(0), b = pushedBuffer.getChannelData(0);
    const [from, to] = WINDOW;
    let ab = 0, aa = 0;
    for (let i = from; i < to; i++) { ab += a[i] * b[i]; aa += a[i] * a[i]; }
    const scale = aa > 0 ? ab / aa : 0;
    const rest = new Float32Array(to - from);
    for (let i = from; i < to; i++) rest[i - from] = b[i] - scale * a[i];
    return rest;
  }

  const heard = (buffer) => buffer.getChannelData(0).slice(WINDOW[0], WINDOW[1]);

  function loud(samples) {
    let sum = 0;
    for (const v of samples) sum += v * v;
    return Math.sqrt(sum / samples.length);
  }

  /** What share of a stretch survives a high pass, which says where it sits. */
  function up(samples) {
    const k = Math.exp((-2 * Math.PI * 400) / RATE);
    let prev = 0, prevIn = 0, sum = 0;
    for (const v of samples) {
      prev = k * (prev + v - prevIn);
      prevIn = v;
      sum += prev * prev;
    }
    return Math.sqrt(sum / samples.length) / (loud(samples) || 1);
  }

  /** How much of what came out was not in what went in. */
  const share = (plainBuffer, pushedBuffer) =>
    loud(added(plainBuffer, pushedBuffer)) / loud(heard(pushedBuffer));

  const plain = await render(tone({}));
  const flatDrive = (value) => ({ drive: [{ t: 0, value }, { t: 4, value }] });

  // Nothing drawn has to be the same file, to the sample: the push sits in
  // the middle of the bus, so if it coloured anything at rest every layer
  // with a level drawn on it would be quietly changed.
  const noPush = await render(tone(flatDrive(0)));
  let apart = 0;
  for (let c = 0; c < 2; c++) {
    const a = plain.getChannelData(c), b = noPush.getChannelData(c);
    for (let i = 0; i < a.length; i++) apart = Math.max(apart, Math.abs(a[i] - b[i]));
  }
  check('a push drawn at nothing leaves the sound untouched, to the sample',
    apart < 1e-6, `largest difference ${apart.toExponential(2)}`);

  const pushed = await render(tone(flatDrive(1)));
  const halfPushed = await render(tone(flatDrive(0.5)));
  check('a push bends the sound rather than only turning it up',
    share(plain, pushed) > 0.1,
    `${(share(plain, pushed) * 100).toFixed(1)}% of what comes out was not in what went in`);
  check('and what it adds sits above what was there',
    up(added(plain, pushed)) > up(heard(plain)) * 1.5,
    `the sound ${up(heard(plain)).toFixed(3)}, what the push added ${up(added(plain, pushed)).toFixed(3)}`);
  check('more of it is more of them',
    share(plain, halfPushed) > 0.02 && share(plain, pushed) > share(plain, halfPushed),
    `half ${(share(plain, halfPushed) * 100).toFixed(1)}%, full ${(share(plain, pushed) * 100).toFixed(1)}%`);

  // At the top the two controls are the same piece of machinery, so they have
  // to land in the same place. Below the top they part company on purpose:
  // the layer blends in a hard copy, a sound bends its own curve less far.
  const onOneSound = await render(tone({}, 1));
  check('a layer pushed all the way is the same push as a sound pushed all the way',
    Math.abs(share(plain, pushed) / share(plain, onOneSound) - 1) < 0.05,
    `whole layer ${(share(plain, pushed) * 100).toFixed(1)}%, one sound ${(share(plain, onOneSound) * 100).toFixed(1)}%`);

  // Drawn under a level, the push has to come first: the other way round,
  // drawing a layer quieter would push it less as well.
  const quietPush = await render(tone({ ...flatDrive(1), level: [{ t: 0, value: 0.3 }, { t: 4, value: 0.3 }] }));
  check('the push comes before the level, so riding one does not move the other',
    Math.abs(share(plain, quietPush) / share(plain, pushed) - 1) < 0.05,
    `pushed ${(share(plain, pushed) * 100).toFixed(1)}%, pushed and turned down ${(share(plain, quietPush) * 100).toFixed(1)}%`);

  // ---------- handing it over ----------

  /*
   * The stems have to add back up to the mix with curves drawn, which is not
   * free: each layer's room and position belong to that layer, and a set of
   * files where the room appeared twice, or not at all, would be no use to
   * whoever picks them up.
   */
  const spread = (() => {
    const [one, two] = base.layers;
    const cues = base.cues.map((cue, i) => (i % 2 ? { ...cue, layerId: two.id } : cue));
    return {
      ...base,
      cues,
      layers: base.layers.map((l) => {
        if (l.id === one.id) return { ...l, auto: { ...emptyLanes(), pan: [{ t: 0, value: -1 }, { t: 4, value: 1 }] } };
        if (l.id === two.id) {
          return { ...l, auto: {
            ...emptyLanes(),
            space: [{ t: 0, value: 0 }, { t: 4, value: 1 }],
            drive: [{ t: 0, value: 1 }, { t: 4, value: 0.2 }],
          } };
        }
        return l;
      }),
    };
  })();

  const settings = DEFAULT_CHAIN, master = { limit: false, target: null };
  const mixed = (await renderProject(spread, { settings, master })).parts[0].buffer;
  const stems = await renderStems(spread, { settings, master });
  let worst = 0;
  for (let c = 0; c < 2; c++) {
    const m = mixed.getChannelData(c);
    const channels = stems.parts.map((p) => p.buffer.getChannelData(c));
    for (let i = 0; i < m.length; i++) {
      let sum = 0;
      for (const d of channels) sum += d[i];
      worst = Math.max(worst, Math.abs(m[i] - sum));
    }
  }
  check('one file per layer still adds back up to the mix, a push included',
    worst < 1e-5, `${stems.parts.length} layers, largest difference ${worst.toExponential(2)}`);

  // ---------- reading between points ----------

  const layer = { id: 'l', name: 'x', muted: false, solo: false, gain: 1,
                  auto: { ...emptyLanes(), level: [{ t: 1, value: 0 }, { t: 3, value: 1 }] } };
  check('the value between two points is read as a straight line',
    layerLevelAt(layer, 0) === 0 && layerLevelAt(layer, 2) === 0.5 &&
    layerLevelAt(layer, 4) === 1 && layerLevelAt(layer, 1.5) === 0.25,
    `${layerLevelAt(layer, 0)}, ${layerLevelAt(layer, 1.5)}, ${layerLevelAt(layer, 2)}, ${layerLevelAt(layer, 4)}`);
  check('an empty lane is worth whatever it means when nobody has drawn on it',
    laneValueAt([], 2, -1) === -1 && laneValueAt([], 2, 0) === 0, '');

  const failed = results.filter((r) => !r.pass);
  document.getElementById('out').textContent = JSON.stringify(
    { passed: results.length - failed.length, of: results.length, results }, null, 1);
  document.title = 'done';
</script></body></html>
